<div class="container-fluid py-4">

  <!-- Header -->
  <div class="d-flex justify-content-between align-items-center mb-4">

    <div>
      <h3 class="fw-bold mb-1">Nurses</h3>

      <p class="text-muted mb-0">
        Manage hospital nursing staff
      </p>
    </div>

    <a
      routerLink="/admin/nursing/add"
      class="btn btn-primary">

      <i class="bi bi-plus-lg me-2"></i>
      Add Nurse

    </a>

  </div>


  <!-- Table -->
  <div class="card shadow-sm border-0">

    <div class="card-body">

      <div class="table-responsive">

        <table class="table table-hover align-middle">

          <thead class="table-light">

            <tr>
              <th>Nurse ID</th>
              <th>Name</th>
              <th>Department</th>
              <th>Ward</th>
              <th>Shift</th>
              <th>Phone</th>
              <th>Status</th>
              <th>Actions</th>
            </tr>

          </thead>


          <tbody>

            <tr *ngFor="let nurse of nurses">

              <td>
                <strong>
                  {{ nurse.nurseId }}
                </strong>
              </td>

              <td>
                {{ nurse.name }}
              </td>

              <td>
                {{ nurse.department }}
              </td>

              <td>
                {{ nurse.ward }}
              </td>

              <td>
                {{ nurse.shift }}
              </td>

              <td>
                {{ nurse.phone }}
              </td>

              <td>

                <span
                  class="badge"
                  [ngClass]="{
                    'bg-success': nurse.status === 'Active',
                    'bg-secondary': nurse.status === 'Inactive',
                    'bg-warning text-dark': nurse.status === 'On Leave'
                  }">

                  {{ nurse.status }}

                </span>

              </td>


              <td>

                <div class="d-flex gap-2">

                  <!-- View -->
                  <a
                    [routerLink]="[
                      '/admin/nursing/view',
                      nurse.id
                    ]"
                    class="btn btn-sm btn-outline-info"
                    title="View">

                    <i class="bi bi-eye"></i>

                  </a>


                  <!-- Edit -->
                  <a
                    [routerLink]="[
                      '/admin/nursing/edit',
                      nurse.id
                    ]"
                    class="btn btn-sm btn-outline-primary"
                    title="Edit">

                    <i class="bi bi-pencil"></i>

                  </a>


                  <!-- Delete -->
                  <button
                    type="button"
                    class="btn btn-sm btn-outline-danger"
                    title="Delete"
                    (click)="deleteNurse(nurse.id)">

                    <i class="bi bi-trash"></i>

                  </button>

                </div>

              </td>

            </tr>


            <!-- Empty -->
            <tr *ngIf="nurses.length === 0">

              <td
                colspan="8"
                class="text-center text-muted py-4">

                No nurses found.

              </td>

            </tr>

          </tbody>

        </table>

      </div>

    </div>

  </div>

</div>
