<div class="container-fluid py-4">

  <!-- Header -->
  <div class="mb-4">

    <h3 class="fw-bold mb-1">
      {{ isEdit ? 'Edit Medicine' : 'Add Medicine' }}
    </h3>

    <p class="text-muted mb-0">
      {{ isEdit
        ? 'Update medicine and inventory information'
        : 'Add a new medicine to pharmacy inventory'
      }}
    </p>

  </div>


  <!-- Form Card -->
  <div class="card shadow-sm border-0">

    <div class="card-body p-4">

      <form
        #medicineForm="ngForm"
        (ngSubmit)="saveMedicine()">

        <div class="row g-3">

          <!-- Medicine ID -->
          <div class="col-md-6">

            <label class="form-label">
              Medicine ID
            </label>

            <input
              type="text"
              class="form-control"
              name="medicineId"
              [(ngModel)]="medicine.medicineId"
              placeholder="Example: MED-1011"
              required>

          </div>


          <!-- Medicine Name -->
          <div class="col-md-6">

            <label class="form-label">
              Medicine Name
            </label>

            <input
              type="text"
              class="form-control"
              name="medicineName"
              [(ngModel)]="medicine.medicineName"
              placeholder="Example: Paracetamol 500mg"
              required>

          </div>


          <!-- Category -->
          <div class="col-md-6">

            <label class="form-label">
              Category
            </label>

            <select
              class="form-select"
              name="category"
              [(ngModel)]="medicine.category"
              required>

              <option value="">
                Select Category
              </option>

              <option value="Pain Relief">
                Pain Relief
              </option>

              <option value="Antibiotic">
                Antibiotic
              </option>

              <option value="Gastric">
                Gastric
              </option>

              <option value="Diabetes">
                Diabetes
              </option>

              <option value="Respiratory">
                Respiratory
              </option>

              <option value="Antihistamine">
                Antihistamine
              </option>

              <option value="Cardiovascular">
                Cardiovascular
              </option>

              <option value="Vitamin">
                Vitamin
              </option>

            </select>

          </div>


          <!-- Manufacturer -->
          <div class="col-md-6">

            <label class="form-label">
              Manufacturer
            </label>

            <input
              type="text"
              class="form-control"
              name="manufacturer"
              [(ngModel)]="medicine.manufacturer"
              placeholder="Enter manufacturer"
              required>

          </div>


          <!-- Quantity -->
          <div class="col-md-6">

            <label class="form-label">
              Quantity
            </label>

            <input
              type="number"
              class="form-control"
              name="quantity"
              [(ngModel)]="medicine.quantity"
              min="0"
              placeholder="Enter stock quantity"
              required>

          </div>


          <!-- Unit Price -->
          <div class="col-md-6">

            <label class="form-label">
              Unit Price (৳)
            </label>

            <input
              type="number"
              class="form-control"
              name="unitPrice"
              [(ngModel)]="medicine.unitPrice"
              min="0"
              step="0.01"
              placeholder="Enter unit price"
              required>

          </div>


          <!-- Expiry Date -->
          <div class="col-md-6">

            <label class="form-label">
              Expiry Date
            </label>

            <input
              type="date"
              class="form-control"
              name="expiryDate"
              [(ngModel)]="medicine.expiryDate"
              required>

          </div>


          <!-- Supplier -->
          <div class="col-md-6">

            <label class="form-label">
              Supplier
            </label>

            <input
              type="text"
              class="form-control"
              name="supplier"
              [(ngModel)]="medicine.supplier"
              placeholder="Enter supplier name"
              required>

          </div>


          <!-- Status -->
          <div class="col-md-6">

            <label class="form-label">
              Status
            </label>

            <select
              class="form-select"
              name="status"
              [(ngModel)]="medicine.status">

              <option value="Available">
                Available
              </option>

              <option value="Low Stock">
                Low Stock
              </option>

              <option value="Out of Stock">
                Out of Stock
              </option>

              <option value="Expired">
                Expired
              </option>

            </select>

          </div>


          <!-- Buttons -->
          <div class="col-12 mt-4">

            <button
              type="submit"
              class="btn btn-primary me-2">

              <i class="bi bi-check-lg me-2"></i>

              {{ isEdit
                ? 'Update Medicine'
                : 'Save Medicine'
              }}

            </button>


            <a
              routerLink="/admin/pharmacy"
              class="btn btn-secondary">

              <i class="bi bi-x-lg me-2"></i>

              Cancel

            </a>

          </div>

        </div>

      </form>

    </div>

  </div>

</div>
