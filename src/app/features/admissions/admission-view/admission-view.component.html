<div class="container-fluid py-4">

  <div class="d-flex justify-content-between align-items-center mb-4">

    <div>
      <h3 class="fw-bold mb-1">Admission Details</h3>
      <p class="text-muted mb-0">
        View patient admission information
      </p>
    </div>

    <div class="d-flex gap-2">

      <a
        [routerLink]="['/admin/admissions/edit', admission.id]"
        class="btn btn-primary">
        <i class="bi bi-pencil me-2"></i>
        Edit
      </a>

      <a
        routerLink="/admin/admissions"
        class="btn btn-secondary">
        Back
      </a>

    </div>

  </div>

  <div class="card shadow-sm border-0">

    <div class="card-body p-4">

      <div class="row g-4">

        <div class="col-md-6">
          <label class="text-muted">Admission ID</label>
          <h6>{{ admission.admissionId }}</h6>
        </div>

        <div class="col-md-6">
          <label class="text-muted">Patient Name</label>
          <h6>{{ admission.patientName }}</h6>
        </div>

        <div class="col-md-6">
          <label class="text-muted">Department</label>
          <h6>{{ admission.department }}</h6>
        </div>

        <div class="col-md-6">
          <label class="text-muted">Doctor</label>
          <h6>{{ admission.doctor }}</h6>
        </div>

        <div class="col-md-6">
          <label class="text-muted">Admission Date</label>
          <h6>{{ admission.admissionDate }}</h6>
        </div>

        <div class="col-md-6">
          <label class="text-muted">Ward</label>
          <h6>{{ admission.ward }}</h6>
        </div>

        <div class="col-md-6">
          <label class="text-muted">Bed Number</label>
          <h6>{{ admission.bed }}</h6>
        </div>

        <div class="col-md-6">
          <label class="text-muted">Status</label>
          <span class="badge bg-success">
            {{ admission.status }}
          </span>
        </div>

        <div class="col-12">
          <label class="text-muted">Reason for Admission</label>
          <p class="mb-0">
            {{ admission.reason }}
          </p>
        </div>

      </div>

    </div>

  </div>

</div>
