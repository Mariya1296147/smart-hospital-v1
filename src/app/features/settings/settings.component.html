<div class="settings-page"><header class="page-header"><div><span class="eyebrow"><i class="bi bi-gear-fill"></i> Administration</span><h2>Settings</h2><p>Manage hospital details, preferences and notifications.</p></div><button class="btn btn-primary" (click)="save()"><i class="bi bi-check-lg"></i> Save settings</button></header><div *ngIf="saved" class="alert alert-success py-2">Settings saved successfully.</div><section class="settings-card"><h4><i class="bi bi-hospital me-2"></i>Hospital information</h4><div class="row g-3 mt-1"><div class="col-md-6"><label>Hospital name</label><input class="form-control" [(ngModel)]="settings.hospitalName"></div><div class="col-md-6"><label>Official email</label><input type="email" class="form-control" [(ngModel)]="settings.email"></div><div class="col-md-6"><label>Phone number</label><input class="form-control" [(ngModel)]="settings.phone"></div><div class="col-md-6"><label>Timezone</label><select class="form-select" [(ngModel)]="settings.timezone"><option value="Asia/Dhaka">Asia/Dhaka (BST)</option><option value="UTC">UTC</option></select></div><div class="col-12"><label>Address</label><textarea class="form-control" rows="3" [(ngModel)]="settings.address"></textarea></div></div></section><section class="settings-card"><h4><i class="bi bi-bell-fill me-2"></i>Notifications</h4><div class="setting-row"><span>Email notifications</span><input class="form-check-input" type="checkbox" [(ngModel)]="settings.emailNotifications"></div><div class="setting-row"><span>Appointment notifications</span><input class="form-check-input" type="checkbox" [(ngModel)]="settings.appointmentNotifications"></div><div class="setting-row"><span>Low stock alerts</span><input class="form-check-input" type="checkbox" [(ngModel)]="settings.stockAlerts"></div></section></div>
