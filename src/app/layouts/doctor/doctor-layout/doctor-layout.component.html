<div class="doctor-layout" [class.sidebar-open]="sidebarOpen">
  <app-doctor-sidebar
    [isOpen]="sidebarOpen"
    (toggle)="toggleSidebar()">
  </app-doctor-sidebar>

  <button
    type="button"
    class="mobile-toggle"
    (click)="toggleSidebar()"
    [attr.aria-expanded]="sidebarOpen"
    aria-label="Toggle doctor sidebar">
    <i class="bi" [class.bi-list]="!sidebarOpen" [class.bi-x-lg]="sidebarOpen"></i>
  </button>

  <div class="main-area">
    <main class="page-content">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>
