
<div class="doctor-sidebar" [class.collapsed]="isCollapsed">

  <!-- Toggle Button -->
  <button
    type="button"
    class="sidebar-toggle"
    (click)="toggleSidebar()"
    aria-label="Toggle Sidebar"
  >
    <i class="bi bi-list"></i>
  </button>


  <!-- Logo -->
  <div class="sidebar-logo">
    <i class="bi bi-hospital"></i>
    <span>Hospital Management</span>
  </div>


  <!-- Doctor Info -->
  <div class="doctor-info">

    <div class="doctor-avatar">
      <i class="bi bi-person-circle"></i>
    </div>

    <div class="doctor-details">
      <h6>Dr. Amina Rahman</h6>
      <small>Doctor</small>
    </div>

  </div>


  <!-- Menu -->
  <nav class="sidebar-menu">

    <!-- Dashboard -->
    <a
      routerLink="/doctor/dashboard"
      routerLinkActive="active"
    >
      <i class="bi bi-speedometer2"></i>
      <span>Dashboard</span>
    </a>


    <!-- My Profile -->
    <a
      routerLink="/doctor/profile"
      routerLinkActive="active"
    >
      <i class="bi bi-person"></i>
      <span>My Profile</span>
    </a>


    <!-- My Patients -->
    <a
      routerLink="/doctor/patients"
      routerLinkActive="active"
    >
      <i class="bi bi-people"></i>
      <span>My Patients</span>
    </a>


    <!-- Appointments -->
    <a
      routerLink="/doctor/appointments"
      routerLinkActive="active"
    >
      <i class="bi bi-calendar-check"></i>
      <span>Appointments</span>
    </a>


    <!-- Consultations -->
    <a
      routerLink="/doctor/consultations"
      routerLinkActive="active"
    >
      <i class="bi bi-chat-left-medical"></i>
      <span>Consultations</span>
    </a>


    <!-- Prescriptions -->
    <a
      routerLink="/doctor/prescriptions"
      routerLinkActive="active"
    >
      <i class="bi bi-prescription2"></i>
      <span>Prescriptions</span>
    </a>


    <!-- Laboratory -->
    <a
      routerLink="/doctor/laboratory"
      routerLinkActive="active"
    >
      <i class="bi bi-eyedropper"></i>
      <span>Laboratory</span>
    </a>


    <!-- Admissions -->
    <a
      routerLink="/doctor/admissions"
      routerLinkActive="active"
    >
      <i class="bi bi-hospital"></i>
      <span>Admissions</span>
    </a>


    <!-- Discharge -->
    <a
      routerLink="/doctor/discharge"
      routerLinkActive="active"
    >
      <i class="bi bi-box-arrow-right"></i>
      <span>Discharge</span>
    </a>


    <!-- Notifications -->
    <a
      routerLink="/doctor/notifications"
      routerLinkActive="active"
    >
      <i class="bi bi-bell"></i>
      <span>Notifications</span>
    </a>


    <!-- Logout -->
    <a
      routerLink="/login"
      class="logout-link"
    >
      <i class="bi bi-box-arrow-left"></i>
      <span>Logout</span>
    </a>

  </nav>

</div>
