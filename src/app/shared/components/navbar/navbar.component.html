<nav class="navbar navbar-expand-lg bg-white shadow-sm sticky-top">
  <div class="container-fluid px-4">

    <!-- BRAND -->
    <a class="navbar-brand d-flex align-items-center gap-2" routerLink="/">
      <img
        src="assets/hospitalss.jpg"
        alt="Smart Hospital Logo"
        class="hospital-logo">
    </a>

    <!-- MOBILE MENU BUTTON -->
    <button
      class="navbar-toggler"
      type="button"
      (click)="toggleMenu()"
      [attr.aria-expanded]="isMenuOpen"
      aria-controls="publicNavbar"
      aria-label="Toggle navigation">

      <span class="navbar-toggler-icon"></span>
    </button>

    <!-- NAVIGATION -->
    <div
      class="navbar-collapse"
      [class.show]="isMenuOpen"
      id="publicNavbar">

      <!-- MAIN MENU -->
      <ul class="navbar-nav mx-auto mb-2 mb-lg-0">

        <li class="nav-item">
          <a
            class="nav-link"
            routerLink="/"
            routerLinkActive="active"
            [routerLinkActiveOptions]="{ exact: true }"
            (click)="closeMenu()">
            Home
          </a>
        </li>

        <li class="nav-item">
          <a
            class="nav-link"
            routerLink="/about"
            routerLinkActive="active"
            (click)="closeMenu()">
            About Us
          </a>
        </li>

        <li class="nav-item">
          <a
            class="nav-link"
            routerLink="/services"
            routerLinkActive="active"
            (click)="closeMenu()">
            Services
          </a>
        </li>

        <li class="nav-item">
          <a
            class="nav-link"
            routerLink="/doctors"
            routerLinkActive="active"
            (click)="closeMenu()">
            Doctors
          </a>
        </li>

        <li class="nav-item">
          <a
            class="nav-link"
            routerLink="/departments"
            routerLinkActive="active"
            (click)="closeMenu()">
            Departments
          </a>
        </li>

        <li class="nav-item">
          <a
            class="nav-link"
            routerLink="/contact"
            routerLinkActive="active"
            (click)="closeMenu()">
            Contact
          </a>
        </li>

      </ul>

      <!-- RIGHT BUTTONS -->
      <div class="navbar-buttons">

        <a
          routerLink="/login"
          (click)="closeMenu()"
          class="btn btn-outline-primary login-btn">
          <i class="bi bi-person-lock me-1"></i>
          Login
        </a>

        <a
          routerLink="/patient-scan"
          (click)="closeMenu()"
          class="btn btn-outline-primary">
          <i class="bi bi-qr-code-scan me-1"></i>
          Patient Scan
        </a>

        <a
          routerLink="/appointment"
          (click)="closeMenu()"
          class="btn btn-primary appointment-btn">
          <i class="bi bi-calendar-check me-1"></i>
          Book Appointment
        </a>

      </div>

    </div>

  </div>
</nav>
